[project]
name = "seoforge"
version = "0.1.0"
description = "End-to-end SEO SaaS + MCP server for Codex/ChatGPT: GSC, crawl, PAA question pages, backlinks, internal linking, faceted nav, review/FAQ schema, Merchant Center, AI-visibility, browser agent."
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tldextract>=5.4",
    "fastmcp>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.1",
]

[project.optional-dependencies]
browser = ["browser-use>=0.9", "playwright>=1.47"]

[project.scripts]
seoforge = "seoforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["seoforge*"]
